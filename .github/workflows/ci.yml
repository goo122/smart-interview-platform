name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/check_secrets.py

  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend-python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend-python/pyproject.toml
      - run: python -m pip install ".[dev]"
      - name: Validate production configuration contract
        env:
          APP_ENV: production
          APP_SECRET_KEY: ci-only-production-signing-key-with-at-least-32-characters
          APP_DATABASE_URL: postgresql+asyncpg://app:ci-only-password@postgres:5432/interview
          APP_REDIS_URL: redis://redis:6379/0
          APP_AI_PROVIDER: openai_compatible
          APP_LLM_API_KEY: ci-only-provider-key
          APP_LLM_BASE_URL: https://llm.invalid/v1
          APP_LLM_MODEL: chat-model
          APP_EMBEDDING_PROVIDER: openai_compatible
          APP_EMBEDDING_API_KEY: ci-only-embedding-key
          APP_EMBEDDING_BASE_URL: https://embedding.invalid/v1
          APP_EMBEDDING_MODEL: embedding-model
        run: python scripts/check_production_config.py
      - run: python -m ruff check .
      - run: python -m mypy app
      - run: python -m pytest
      - run: python -m alembic heads

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend-python/pyproject.toml
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install ./backend-python
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run api:generate
        working-directory: frontend
      - run: git diff --exit-code -- frontend/src/api/generated.ts
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run test:run
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  integration:
    name: Docker integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python backend-python/scripts/run_integration_tests.py

  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    needs: [backend, frontend, integration]
    timeout-minutes: 25
    env:
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:18080
      PLAYWRIGHT_CAPTURE_TRACE: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start isolated application
        run: docker compose -f docker-compose.yml -f compose.e2e.yml up -d --build
      - name: Wait for application readiness
        shell: bash
        run: |
          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:18080/api/health/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.yml -f compose.e2e.yml ps
          exit 1
      - run: npm run test:e2e
        working-directory: frontend
      - name: Upload synthetic failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            frontend/test-results/**/*.png
            frontend/test-results/**/*.webm
            frontend/test-results/**/*.md
          if-no-files-found: ignore
          retention-days: 7
      - name: Clean up isolated application
        if: always()
        run: docker compose -f docker-compose.yml -f compose.e2e.yml down -v --remove-orphans
