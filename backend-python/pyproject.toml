[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-interview-backend"
version = "0.1.0"
description = "FastAPI backend for the intelligent mock interview platform"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.14,<2.0",
    "asyncpg>=0.29,<1.0",
    "argon2-cffi>=23.1,<26.0",
    "fastapi>=0.115,<1.0",
    "langgraph>=0.2,<1.0",
    "langchain-openai>=1.0,<2.0",
    "pgvector>=0.3,<1.0",
    "pypdf>=5.0,<7.0",
    "python-multipart>=0.0.20,<1.0",
    "PyJWT>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "redis>=5.2,<7.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "mypy>=1.13,<2.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.8,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: tests requiring Docker PostgreSQL, pgvector and Redis",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
extend-ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["app"]

[tool.setuptools.packages.find]
include = ["app*"]
